<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>news --today</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0D10; --panel:#12151A; --line:#20242B;
    --text:#DCE1E8; --muted:#6B7280; --muted-2:#454B54;
    --accent:#5EEAD4; --accent-dim:rgba(94,234,212,0.12);
    --heart:#FB7185;
    --hn:#FF6600; --tc:#2ECC71; --itm:#4EA1FF; --pk:#C084FC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 12px 60px;}
  .terminal{width:100%;max-width:680px;}
  .statusbar{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;
    padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .prompt{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
  .prompt .user{color:var(--accent);}
  .prompt .path{color:var(--text);}
  .cursor{display:inline-block;width:6px;height:12px;background:var(--accent);margin-left:2px;vertical-align:-1px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .meta{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted-2);}

  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{font-family:'JetBrains Mono',monospace;font-size:11.5px;background:transparent;border:1px solid var(--line);
    color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;}
  .tab[data-active="true"]{color:var(--text);border-color:var(--accent-dim);background:var(--accent-dim);}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .flag{font-family:'JetBrains Mono',monospace;font-size:10.5px;background:transparent;border:1px solid var(--line);
    color:var(--muted-2);padding:4px 9px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .15s ease;}
  .flag .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}
  .flag[data-active="true"]{color:var(--text);border-color:var(--accent-dim);background:var(--accent-dim);}
  .flag[data-src="hn"][data-active="true"]{color:var(--hn);}
  .flag[data-src="tc"][data-active="true"]{color:var(--tc);}
  .flag[data-src="itm"][data-active="true"]{color:var(--itm);}
  .flag[data-src="pk"][data-active="true"]{color:var(--pk);}

  .count-line{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);min-height:16px;margin-bottom:8px;}
  .feed{border-top:1px solid var(--line);}
  .item{padding:11px 2px;border-bottom:1px solid var(--line);}

  .item-head{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-2);margin-bottom:4px;}
  .item-src{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .item-src .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
  .src-hn{color:var(--hn);} .src-tc{color:var(--tc);} .src-itm{color:var(--itm);} .src-pk{color:var(--pk);}
  .item-time{color:var(--muted-2);}
  .item-sep{color:var(--line);}

  .item-body{display:flex;align-items:flex-start;gap:8px;}
  .item-title{font-weight:500;font-size:13px;line-height:1.55;flex:1;cursor:pointer;}
  .item-title:hover{color:var(--accent);}
  .like-btn{flex-shrink:0;background:none;border:none;font-size:15px;line-height:1;cursor:pointer;
    padding:2px 4px;color:var(--muted-2);opacity:0.6;}
  .like-btn[data-liked="true"]{color:var(--heart);opacity:1;}

  .item-excerpt{font-size:11.5px;line-height:1.65;color:var(--muted);margin:8px 0 2px 0;display:none;}
  .item.open .item-excerpt{display:block;}
  .item-link{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--accent);display:none;}
  .item.open .item-link{display:inline-block;margin-top:5px;}
  .item-link:hover{text-decoration:underline;}

  .liked-date{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted-2);}
  .empty{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;padding:26px 4px;text-align:center;}
  a{color:inherit;text-decoration:none;}
</style>
</head>
<body>
<div class="terminal">
  <div class="statusbar">
    <div class="prompt"><span class="user">guest@it-news</span> <span class="path">~$</span> tail -f today<span class="cursor"></span></div>
    <div class="meta" id="genTime">読み込み中...</div>
  </div>

  <div class="tabs">
    <button class="tab" data-tab="today" data-active="true">今日</button>
    <button class="tab" data-tab="liked" data-active="false">お気に入り <span id="likedCount">(0)</span></button>
  </div>

  <div class="filters" id="filters">
    <button class="flag" data-src="hn" data-active="true"><span class="dot"></span>--hn</button>
    <button class="flag" data-src="tc" data-active="true"><span class="dot"></span>--techcrunch</button>
    <button class="flag" data-src="itm" data-active="true"><span class="dot"></span>--itmedia</button>
    <button class="flag" data-src="pk" data-active="true"><span class="dot"></span>--publickey</button>
  </div>

  <div class="count-line" id="countLine"></div>
  <main class="feed" id="feed"></main>
</div>

<script>
const SOURCES = {
  hn:  { label: 'HN',        cls: 'src-hn'  },
  tc:  { label: 'TechCrunch',cls: 'src-tc'  },
  itm: { label: 'ITmedia',   cls: 'src-itm' },
  pk:  { label: 'Publickey', cls: 'src-pk'  },
};
const LIKE_KEY = 'it-news-liked-v1';

// news.json がまだ無い/取得失敗した時のフォールバック表示
const FALLBACK = {
  generated_at: null,
  items: [{
    source: 'hn', title: 'まだ news.json がありません。GitHub Actionsを一度実行してください。',
    url: '#', time_iso: new Date().toISOString(), excerpt: ''
  }]
};

let todayItems = [];
let activeSrc = new Set(Object.keys(SOURCES));
let currentTab = 'today';

function loadLiked(){
  try{ return JSON.parse(localStorage.getItem(LIKE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveLiked(map){
  localStorage.setItem(LIKE_KEY, JSON.stringify(map));
}
let liked = loadLiked();

function relTime(iso){
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const now = new Date();
  const diffMin = Math.round((now - d) / 60000);
  if (diffMin < 1) return 'たった今';
  if (diffMin < 60) return `${diffMin}分前`;
  const diffH = Math.round(diffMin / 60);
  if (diffH < 24) return `${diffH}時間前`;
  const sameYear = d.getFullYear() === now.getFullYear();
  return d.toLocaleDateString('ja-JP', {month:'numeric', day:'numeric', year: sameYear ? undefined : 'numeric'});
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function displayTitle(it){
  return it.title_ja || it.title;
}

function renderItem(it, opts){
  opts = opts || {};
  const meta = SOURCES[it.source] || { label: it.source, cls: '' };
  const isLiked = !!liked[it.url];
  const excerptHtml = it.excerpt ? `<div class="item-excerpt">${escapeHtml(it.excerpt)}</div>` : '';
  const likedDateHtml = opts.showLikedDate && liked[it.url]
    ? `<span class="liked-date"> ・ ${new Date(liked[it.url].likedAt).toLocaleDateString('ja-JP')}にいいね</span>` : '';

  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `
    <div class="item-head">
      <span class="item-src ${meta.cls}"><span class="dot"></span>${meta.label}</span>
      <span class="item-sep">・</span>
      <span class="item-time">${relTime(it.time_iso)}</span>
      ${likedDateHtml}
    </div>
    <div class="item-body">
      <span class="item-title">${escapeHtml(displayTitle(it))}</span>
      <button class="like-btn" data-liked="${isLiked}" aria-label="いいね">${isLiked ? '♥' : '♡'}</button>
    </div>
    ${excerptHtml}
    <a class="item-link" href="${it.url}" target="_blank" rel="noopener">記事を開く →</a>
  `;

  el.querySelector('.item-title').addEventListener('click', () => el.classList.toggle('open'));
  el.querySelector('.like-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleLike(it);
    render();
  });
  return el;
}

function toggleLike(it){
  if (liked[it.url]){
    delete liked[it.url];
  } else {
    liked[it.url] = {
      source: it.source, title: it.title, title_ja: it.title_ja || null,
      url: it.url, excerpt: it.excerpt || '', likedAt: new Date().toISOString(),
    };
  }
  saveLiked(liked);
}

function render(){
  document.getElementById('likedCount').textContent = `(${Object.keys(liked).length})`;
  document.getElementById('filters').style.display = currentTab === 'today' ? 'flex' : 'none';

  const feed = document.getElementById('feed');
  feed.innerHTML = '';

  let list;
  if (currentTab === 'today'){
    list = todayItems.filter(it => activeSrc.has(it.source));
  } else {
    list = Object.values(liked).sort((a, b) => new Date(b.likedAt) - new Date(a.likedAt));
  }

  document.getElementById('countLine').textContent = `${list.length} 件`;

  if (list.length === 0){
    const msg = currentTab === 'today'
      ? '表示できる記事がありません。--flag を有効にしてください。'
      : 'まだいいねした記事がありません。♡ をタップすると保存されます。';
    feed.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  list.forEach(it => feed.appendChild(renderItem(it, { showLikedDate: currentTab === 'liked' })));
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.dataset.active = 'false');
    btn.dataset.active = 'true';
    currentTab = btn.dataset.tab;
    render();
  });
});

document.querySelectorAll('.flag').forEach(btn => {
  btn.addEventListener('click', () => {
    const src = btn.dataset.src;
    const active = btn.dataset.active === 'true';
    btn.dataset.active = active ? 'false' : 'true';
    if (active) activeSrc.delete(src); else activeSrc.add(src);
    render();
  });
});

async function init(){
  try{
    const res = await fetch('./news.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('news.json not found');
    const data = await res.json();
    todayItems = data.items || [];
    document.getElementById('genTime').textContent = data.generated_at
      ? '更新: ' + new Date(data.generated_at).toLocaleString('ja-JP')
      : '';
  }catch(e){
    todayItems = FALLBACK.items;
    document.getElementById('genTime').textContent = 'news.json 未生成';
  }
  render();
}

init();
</script>
</body>
</html>
