name: Update IT News

on:
  schedule:
    - cron: '0 22 * * *'   # UTC 22:00 = JST 07:00 に毎日実行
  workflow_dispatch: {}     # Actionsタブから手動実行もできる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fetch_news.py

      - name: Commit and push if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || git commit -m "chore: update news $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push
